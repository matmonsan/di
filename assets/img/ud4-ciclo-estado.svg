<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo de estado en React</title>
  <desc id="desc">El componente se renderiza, el usuario interactúa, un manejador llama a setEstado con el nuevo valor y React vuelve a ejecutar el componente para actualizar el DOM.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#52708f"/>
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #20344d; }
      .head { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; fill: #52657a; }
    </style>
  </defs>
  <rect width="1000" height="330" rx="18" fill="#f5f8fc"/>
  <rect x="50" y="108" width="190" height="80" rx="14" fill="#eaf2fc" stroke="#8bb4e8" stroke-width="2"/>
  <text x="145" y="143" text-anchor="middle" class="head">Renderizado</text>
  <text x="145" y="166" text-anchor="middle" class="small">muestra el estado</text>
  <rect x="300" y="108" width="190" height="80" rx="14" fill="#fff" stroke="#c7d2df" stroke-width="2"/>
  <text x="395" y="143" text-anchor="middle" class="head">Interacción</text>
  <text x="395" y="166" text-anchor="middle" class="small">usuario actúa</text>
  <rect x="550" y="108" width="200" height="80" rx="14" fill="#fff" stroke="#c7d2df" stroke-width="2"/>
  <text x="650" y="143" text-anchor="middle" class="head">Manejador</text>
  <text x="650" y="166" text-anchor="middle" class="small">llama a setEstado</text>
  <rect x="810" y="108" width="150" height="80" rx="14" fill="#eef7f1" stroke="#abd2b7" stroke-width="2"/>
  <text x="885" y="143" text-anchor="middle" class="head">Nuevo estado</text>
  <text x="885" y="166" text-anchor="middle" class="small">actualiza el DOM</text>
  <g stroke="#52708f" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M245 148h48"/>
    <path d="M495 148h48"/>
    <path d="M755 148h48"/>
    <path d="M885 194v66H145v-66"/>
  </g>
  <text x="515" y="292" text-anchor="middle" class="small">React vuelve a ejecutar el componente con el nuevo valor</text>
</svg>
