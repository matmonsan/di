<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1214" role="img" aria-labelledby="title desc">
  <title id="title">Ejemplo de la aplicación de notas</title>
  <desc id="desc">Posible visualización de la práctica 4.6 con estilos básicos: título y subtítulo, resumen con el total de notas, completadas, pendientes y de prioridad alta, notas agrupadas por categoría (Clase, Personal y Trabajo) y ordenadas por fecha, y pie con el año. Las notas completadas aparecen atenuadas y tachadas y el borde izquierdo indica la prioridad.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
      .h1 { font-size: 28px; font-weight: bold; }
      .h2 { font-size: 20px; font-weight: bold; }
      .h3 { font-size: 16px; font-weight: bold; }
      .p { font-size: 15px; fill: #555; }
      .t { font-size: 16px; font-weight: bold; }
      .s { font-size: 13px; }
      .d { font-size: 12px; fill: #555; }
      .g { font-size: 11px; }
    </style>
  </defs>
  <rect width="700" height="1214" fill="#fff"/>
  <text x="90" y="44" class="h1">Mis notas</text>
<text x="90" y="70" class="p">Organiza tus tareas del día a día</text>
