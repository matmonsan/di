<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1126" role="img" aria-labelledby="title desc">
  <title id="title">Ejemplo de la aplicación de notas</title>
  <desc id="desc">Posible visualización de la práctica 4.6 con estilos básicos: título y subtítulo, resumen con el total de notas, completadas y pendientes, notas ordenadas por fecha, y pie con el año. Las notas completadas aparecen atenuadas y tachadas y el borde izquierdo indica la prioridad.</desc>
